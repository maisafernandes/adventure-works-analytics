version: 2

models:
  - name: int_customer
    description: "Modelo intermediário que cruza clientes, pessoas e lojas para formar a base da dimensão de clientes."
    columns:
      - name: customer_id
        description: "Chave primária do cliente."
        data_tests:
          - unique
          - not_null

      - name: business_entity_id
        description: "Identificador da entidade de negócio (Pessoa Física ou Loja)."

      - name: full_name
        description: "Nome completo do cliente (se pessoa física)."

      - name: store_name
        description: "Nome da loja (se cliente corporativo / PJ)."