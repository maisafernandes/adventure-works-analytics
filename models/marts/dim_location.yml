version: 2

models:
  - name: dim_location
    description: "Dimensão de localidades geográficas de vendas, no grão de endereço (cidade, estado/província, país e território)."
    columns:
      - name: location_sk
        description: "Chave substituta (surrogate key) da localidade. Chave primária da dimensão."
        data_tests:
          - unique
          - not_null
      - name: address_id
        description: "Identificador natural do endereço na origem."
        data_tests:
          - unique
          - not_null
      - name: city
        description: "Cidade associada ao endereço."
      - name: state_province_name
        description: "Nome do estado ou província."
      - name: country_region_code
        description: "Código do país/região."
      - name: territory_id
        description: "Identificador do território de vendas."
      - name: territory_name
        description: "Nome do território de vendas."
