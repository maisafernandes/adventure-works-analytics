version: 2

models:
  - name: fact_sales
    description: "Tabela fato de vendas no grão do item do pedido (uma linha por sales_order_detail_id). Os motivos de venda ficam na tabela ponte bridge_sales_order_reason, ligada por dim_sales_order, para não duplicar receita."
    columns:
      - name: sales_order_id
        description: "Chave estrangeira para dim_sales_order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_order')
                field: sales_order_id

      - name: sales_order_detail_id
        description: "Identificador do item do pedido. Chave única da fato."
        data_tests:
          - unique
          - not_null

      - name: order_date
        description: "Data em que o pedido foi realizado. Conecta com dim_date."
        data_tests:
          - not_null

      - name: customer_id
        description: "Chave estrangeira para dim_customer."

      - name: product_id
        description: "Chave estrangeira para dim_product."

      - name: address_id
        description: "Chave estrangeira para dim_location. Define o local exato da entrega."
        data_tests:
          - not_null

      - name: territory_id
        description: "Identificador do território de vendas (mantido na fato para análises diretas sem necessidade de join com dim_location)."

      - name: credit_card_id
        description: "Chave estrangeira para dim_credit_card."

      - name: order_qty
        description: "Quantidade física de produtos faturados."

      - name: unit_price
        description: "Preço unitário original do produto."

      - name: unit_price_discount
        description: "Percentual de desconto unitário aplicado (0 a 1)."

      - name: gross_revenue
        description: "Receita bruta do item, sem desconto: qty * unit_price."
        data_tests:
          - not_null

      - name: discount_amount
        description: "Valor do desconto do item: qty * unit_price * discount."

      - name: revenue
        description: "Receita líquida do item, calculada como qty * unit_price * (1 - discount)."
        data_tests:
          - not_null
