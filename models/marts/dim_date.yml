version: 2

models:
  - name: dim_date
    description: "Dimensão de calendário para análises temporais e séries históricas (2011 a 2014)."
    columns:
      - name: date_sk
        description: "Chave substituta da data no formato AAAAMMDD. Chave primária da dimensão."
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: "Data completa."
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Ano da data."
      - name: month
        description: "Número do mês (1 a 12)."
      - name: month_name
        description: "Nome do mês em inglês."
      - name: day
        description: "Dia do mês."
      - name: quarter
        description: "Trimestre do ano (1 a 4)."
