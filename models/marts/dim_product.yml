version: 2

models:
  - name: dim_product
    description: "Dimensão de produtos comercializados, com categoria e subcategoria. Produtos sem subcategoria (componentes internos) têm categoria e subcategoria nulas."
    columns:
      - name: product_id
        description: "Chave primária do produto."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Nome do produto."
      - name: product_number
        description: "Código do produto."
      - name: color
        description: "Cor do produto."
      - name: list_price
        description: "Preço de tabela do produto."
      - name: product_subcategory_name
        description: "Nome da subcategoria do produto."
      - name: product_category_name
        description: "Nome da categoria do produto."
