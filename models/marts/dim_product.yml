version: 2

models:
  - name: dim_product
    description: "Dimensão de produtos comercializados, com categoria e subcategoria. Produtos sem subcategoria na origem (peças e subconjuntos) aparecem como 'Sem categoria' e 'Sem subcategoria'."
    columns:
      - name: product_sk
        description: "Chave substituta (surrogate key) do produto. Chave primária da dimensão."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "Identificador natural do produto na origem."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Nome do produto."
      - name: product_number
        description: "Código do produto."
      - name: color
        description: "Cor do produto."
      - name: list_price
        description: "Preço de tabela do produto."
      - name: product_subcategory_name
        description: "Nome da subcategoria do produto ('Sem subcategoria' quando não informada)."
      - name: product_category_name
        description: "Nome da categoria do produto ('Sem categoria' quando não informada)."
